[project]
name = "planktolab"
version = "0.1.0"
description = ""
authors = [
    {name = "léo DÉCHAUMET"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14.1 || >3.14.1,<3.15"
dependencies = [
    "torch (>=2.12.1,<3.0.0)",
    "torchvision (>=0.27.1,<0.28.0)",
    "plotly (>=6.8.0,<7.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "tqdm (>=4.68.3,<5.0.0)",
    "pytorch-lightning (>=2.6.5,<3.0.0)",
    "albumentations (>=2.0.8,<3.0.0)",
    "umap-learn (>=0.5.12,<0.6.0)",
    "dash[diskcache] (>=4.3.0,<5.0.0)",
    "typer (>=0.26.8,<0.27.0)",
    "dash-mantine-components (>=2.8.0,<3.0.0)",
    "diskcache (>=5.6.3,<6.0.0)",
    "codecarbon (>=3.2.8,<4.0.0)"
]

[project.scripts]
planktolab = "planktolab.cli:app"
planktolab-gui = "planktolab.gui:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
